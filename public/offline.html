<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offline — JCAT HRM</title>
  <style>
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
      background:#0f1117;color:#e8e9ee;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;text-align:center;padding:24px}
    img{width:72px;height:72px;border-radius:16px}
    h1{font-size:22px;margin:20px 0 8px}
    p{margin:0 0 24px;color:#9aa0b0;max-width:320px;line-height:1.5}
    button{background:linear-gradient(90deg,#fc0175,#7c5cfc);color:#fff;border:0;border-radius:10px;padding:12px 24px;font-size:15px;font-weight:600;cursor:pointer}
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="JCAT HRM" />
    <h1>You’re offline</h1>
    <p>JCAT HRM needs an internet connection to load your data. Check your connection and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
